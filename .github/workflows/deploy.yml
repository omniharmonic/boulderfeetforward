# Builds the site and publishes it to GitHub Pages every time someone saves a change.
# That includes changes made in the site editor at /admin/.
#
# The site is public at https://boulderfeetforward.org (launched without the password gate).
#
# Designed and built by Benjamin Life (@omniharmonic) as a gift to Boulder Feet Forward.
name: Build and publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - id: pages
        uses: actions/configure-pages@v5

      - run: npm ci

      - name: Build the site
        run: npm run build
        env:
          SITE_URL: https://boulderfeetforward.org
          BASE_PATH: /
          # Public: search engines welcome.
          PUBLIC_NOINDEX: "false"
          # Hide the "Draft for Libby" notes and "waiting on written OK" flags.
          PUBLIC_SHOW_DRAFTS: "false"
          # Hide any quote that still says "Waiting on written OK". Switch that off on a quote in the editor to show it.
          PUBLIC_REQUIRE_CONSENT: "true"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
